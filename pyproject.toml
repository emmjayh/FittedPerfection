[project]
name = "fittedperfection"
dynamic = ["version"]
description = "Deterministic fitting of generated outfits onto four fixed MPFB bodies"
requires-python = ">=3.13"

[tool.setuptools.dynamic]
version = { attr = "fittedperfection.VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
